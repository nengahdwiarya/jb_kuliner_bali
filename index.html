<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JB Kuliner</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header & Navigasi -->
  <header>
    <div class="container header-container">
      <h1 class="logo">JB Kuliner</h1>
      <button id="cart-button" class="cart-btn">
        🛒 <span id="cart-count" class="badge">0</span>
      </button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-content">
      <h2>Sajian Khas Nusantara</h2>
      <p>Nikmati kelezatan masakan otentik dengan resep warisan keluarga.</p>
    </div>
  </section>

  <!-- Main Content (Menu) -->
  <main class="container">
    <div class="menu-header">
      <h2>Menu Kami</h2>
      <input type="text" id="search-input" placeholder="Cari menu... 🔎" class="search-bar">
    </div>

    <!-- Filter Kategori -->
    <div class="category-filters">
      <button class="category active" data-category="Semua">Semua</button>
      <button class="category" data-category="Khas Jawa">Khas Jawa</button>
      <button class="category" data-category="Khas Bali">Khas Bali</button>
      <button class="category" data-category="Camilan">Camilan</button>
      <button class="category" data-category="Minuman">Minuman</button>
    </div>

    <p id="menu-total" class="menu-total">Memuat menu...</p>

    <!-- Grid Menu -->
    <div id="menu-grid" class="menu-grid"></div>
  </main>

  <!-- Reservasi Section -->
  <section class="reservation-section">
    <div class="container reservation-container">
      <h2>Reservasi Meja</h2>
      <form id="reservation-form" class="reservation-form">
        <input type="text" id="customer-name" placeholder="Nama Lengkap" required>
        <input type="number" id="guest-count" placeholder="Jumlah Orang" min="1" required>
        <select id="table-type">
          <option value="Indoor">Indoor</option>
          <option value="Outdoor">Outdoor</option>
          <option value="VIP">VIP</option>
        </select>
        <input type="date" id="reservation-date" required>
        <input type="time" id="reservation-time" required>
        <textarea id="reservation-note" placeholder="Catatan Tambahan (Opsional)" rows="3"></textarea>
        <button type="submit" class="btn-primary">Kirim Reservasi</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <div class="container">
      <p>&copy; <span id="year"></span> JB Kuliner. Dibuat dengan sepenuh hati.</p>
    </div>
  </footer>

  <!-- Sidebar Keranjang -->
  <div id="cart-overlay" class="cart-overlay"></div>
  <aside id="cart-sidebar" class="cart-sidebar">
    <div class="cart-header">
      <h2>Keranjang Pesanan</h2>
      <button id="close-cart" class="close-btn">&times;</button>
    </div>
    <div id="cart-items" class="cart-items">
      <!-- Item keranjang masuk ke sini -->
    </div>
    <div class="cart-footer">
      <div class="cart-total-wrap">
        <span>Total:</span>
        <span id="cart-total" class="cart-total-price">Rp 0</span>
      </div>
      <button id="checkout-button" class="btn-primary w-100">Pesan via WhatsApp</button>
    </div>
  </aside>

  <!-- Toast Notification -->
  <div id="toast" class="toast"></div>

  <!-- Load File JavaScript -->
  <script src="script.js"></script>
</body>
</html>
